<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Dodge</title><style>*{box-sizing:border-box}body{margin:0;background:#080c20;color:white;overflow:hidden;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080c20ba;text-align:center}#overlay.hidden{display:none}.panel{background:#111934e8;border:1px solid #46dfff88;border-radius:16px;padding:30px;max-width:330px;margin:20px;box-shadow:0 0 50px #00beff29}h1{font-size:36px;letter-spacing:4px;margin:0 0 12px;color:#65f3ff}p{line-height:1.6;font-size:14px;color:#c0c9e2}button{border:0;border-radius:7px;background:linear-gradient(100deg,#36e5ec,#a27aff);font-weight:900;padding:14px 29px;color:#080b20;cursor:pointer}#hud{position:absolute;top:15px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none;font-weight:bold;text-shadow:0 0 8px #000}#hud span{color:#5df2f2}#pause{position:absolute;top:52px;right:16px;background:#212f52;border:1px solid #92cfff88;color:#fff;padding:8px 12px;font-size:12px}</style></head><body><canvas id="game"></canvas><div id="hud">ОЧКИ: <span id="score">0</span><div>ЛУЧШИЙ: <span id="best">0</span></div></div><button id="pause">ПАУЗА [P]</button><div id="overlay"><div class="panel"><h1 id="heading">NEON DODGE</h1><p id="message">Управляй кораблём мышкой, пальцем или стрелками ← →. Уворачивайся от розовых препятствий и собирай голубые сферы.</p><button id="start">ИГРАТЬ ▶</button></div></div><script>
(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),heading=document.querySelector('#heading'),message=document.querySelector('#message'),start=document.querySelector('#start');let w=0,h=0,dpr=1,objects=[],stars=[],particles=[],score=0,best=0,elapsed=0,spawn=0,last=0,running=false,paused=false,keys={},player={x:0,y:0,r:17},pointer=null;try{best=Number(localStorage.getItem('sokol-neon-dodge-best')||0)||0}catch{}bestEl.textContent=best;function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);player.x=player.x||w/2;player.y=h-65;stars=Array.from({length:Math.min(90,Math.floor(w*h/5000))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.3,s:20+Math.random()*60}))}addEventListener('resize',resize);resize();function burst(x,y,c,n=14){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=60+Math.random()*200;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.6+Math.random()*.4,c})}}function reset(){objects=[];particles=[];score=0;spawn=0;elapsed=0;player.x=w/2;pointer=null;running=true;paused=false;overlay.classList.add('hidden');document.querySelector('#pause').textContent='ПАУЗА [P]';scoreEl.textContent='0'}function end(){running=false;burst(player.x,player.y,'#ef56b4',35);heading.textContent='GAME OVER';message.textContent=`Результат: ${score} очков. Попробуй побить рекорд!`;start.textContent='ЕЩЁ РАЗ ↻';overlay.classList.remove('hidden');if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('sokol-neon-dodge-best',best)}catch{}}}function togglePause(){if(!running)return;paused=!paused;document.querySelector('#pause').textContent=paused?'ПРОДОЛЖИТЬ [P]':'ПАУЗА [P]';last=performance.now()}start.addEventListener('click',reset);document.querySelector('#pause').addEventListener('click',togglePause);addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='p'&&!e.repeat)togglePause();if((e.key==='Enter'||e.key===' ')&&!running)reset()});addEventListener('keyup',e=>{keys[e.key]=false});canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)pointer=e.clientX});canvas.addEventListener('pointerdown',e=>{pointer=e.clientX});function update(dt){if(keys.ArrowLeft||keys.a||keys.A){pointer=null;player.x-=390*dt}if(keys.ArrowRight||keys.d||keys.D){pointer=null;player.x+=390*dt}if(pointer!==null)player.x+=(pointer-player.x)*Math.min(1,dt*15);player.x=Math.max(18,Math.min(w-18,player.x));elapsed+=dt;spawn+=dt;const interval=Math.max(.24,.72-elapsed*.006);while(spawn>interval){spawn-=interval;const good=Math.random()<.29;objects.push({x:25+Math.random()*Math.max(1,w-50),y:-30,r:good?11:15+Math.random()*10,good,speed:160+Math.min(elapsed*3,220)+Math.random()*75,angle:Math.random()*6.28})}for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.y+=o.speed*dt;o.angle+=dt*2;if(Math.hypot(o.x-player.x,o.y-player.y)<o.r+player.r*.7){objects.splice(i,1);if(o.good){score+=10;scoreEl.textContent=score;burst(o.x,o.y,'#3ff7ed',12)}else {end();return}}else if(o.y>h+40){objects.splice(i,1);if(!o.good){score++;scoreEl.textContent=score}}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)particles.splice(i,1)}}function draw(){ctx.clearRect(0,0,w,h);const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#090e25');bg.addColorStop(1,'#101339');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.strokeStyle='#42caf915';ctx.lineWidth=1;for(let x=0;x<w;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.fillStyle='#b8dfff';for(const s of stars){const y=(s.y+elapsed*s.s)%h;ctx.globalAlpha=.3+.5*s.r/2;ctx.beginPath();ctx.arc(s.x,y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const o of objects){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.angle);ctx.shadowBlur=22;ctx.shadowColor=o.good?'#48fff2':'#ff3aa4';ctx.fillStyle=o.good?'#54f6eb':'#ef4ea6';ctx.strokeStyle='#fff9';ctx.lineWidth=2;if(o.good){ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();ctx.stroke()}else{ctx.fillRect(-o.r,-o.r,o.r*2,o.r*2);ctx.strokeRect(-o.r,-o.r,o.r*2,o.r*2)}ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.min(1,p.life);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;if(running||!overlay.classList.contains('hidden')){ctx.save();ctx.translate(player.x,player.y);ctx.shadowColor='#4ceaff';ctx.shadowBlur=25;ctx.fillStyle='#5ae8ff';ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(19,19);ctx.lineTo(0,10);ctx.lineTo(-19,19);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#f9e884';ctx.fillRect(-6,17,12,10+Math.random()*12);ctx.restore()}if(paused){ctx.fillStyle='#080d20b0';ctx.fillRect(0,0,w,h);ctx.fillStyle='#fff';ctx.font='bold 38px Arial';ctx.textAlign='center';ctx.fillText('ПАУЗА',w/2,h/2)}}function loop(t){let dt=Math.min((t-last)/1000||0,.04);last=t;if(running&&!paused)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
