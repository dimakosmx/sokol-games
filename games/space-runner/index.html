<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPACE RUNNER | SOKOL GAMES</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05091c;color:#eef8ff;font:14px system-ui,Arial,sans-serif}body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}.bar{width:min(96vw,1000px);display:flex;justify-content:space-between;align-items:center;gap:12px}.bar strong{font-size:17px;letter-spacing:.07em}.bar button,.touch button{background:#18294b;border:1px solid #347db2;border-radius:10px;color:#fff;font-weight:800;padding:9px 16px;cursor:pointer}canvas{width:min(96vw,1000px);max-height:calc(100dvh - 170px);aspect-ratio:20/13;object-fit:contain;display:block;border:2px solid #285883;border-radius:16px;box-shadow:0 0 35px #009ce92b;touch-action:none;outline:none}.tips{text-align:center;color:#a8c4de;font-size:13px}.touch{display:flex;justify-content:center;gap:14px;align-items:center}.touch button{min-width:88px;touch-action:none;user-select:none}.touch #fire{border-color:#08cffa;background:#07465e}@media(hover:hover) and (pointer:fine){.touch{display:none}}@media(max-height:540px){.tips{display:none}canvas{max-height:calc(100dvh - 110px)}} </style></head><body><div class="bar"><strong>🚀 SPACE RUNNER</strong><button id="restart">↻ Заново</button></div><canvas id="game" width="1000" height="650" tabindex="0" aria-label="Космическая игра: избегай метеоритов, собирай обломки и стреляй"></canvas><div class="tips">Двигай мышь вверх / вниз · Удерживай левую кнопку для стрельбы · R — рестарт · На телефоне: веди пальцем и нажимай FIRE</div><div class="touch"><button id="up">▲ ВВЕРХ</button><button id="fire">⚡ FIRE</button><button id="down">▼ ВНИЗ</button></div><script src="game.js"></script></body></html>
