<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pong Arena | SOKOL GAMES</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070d20;color:#edf6ff;font-family:system-ui,Arial,sans-serif}body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:12px}.top{width:min(95vw,720px);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}.top button,.controls button{background:#202c58;border:1px solid #5e87c8;color:white;border-radius:9px;padding:9px 13px;font-weight:800;cursor:pointer}canvas{display:block;width:min(95vw,calc((100dvh - 145px)*1.05),720px);aspect-ratio:1;border:2px solid #5065af;border-radius:14px;box-shadow:0 0 45px #2476cb35;outline:none;touch-action:none}.controls{display:flex;gap:18px}.group{display:flex;align-items:center;gap:8px;font-size:13px}.group button{min-width:48px;touch-action:none;user-select:none}.hint{font-size:12px;text-align:center;color:#b6c6dc}@media(max-height:530px){canvas{width:min(76vh,65vw)}.hint{display:none}}</style></head><body><div class="top"><strong>🏓 PONG ARENA · 2 ИГРОКА</strong><button id="restart">↻ Начать заново</button></div><canvas id="game" width="800" height="800" tabindex="0" aria-label="Пинг-понг: красный игрок против синего"></canvas><div class="controls"><div class="group"><span style="color:#ff6c75">КРАСНЫЙ</span><button data-k="w">W ▲</button><button data-k="s">S ▼</button></div><div class="group"><span style="color:#65b5ff">СИНИЙ</span><button data-k="ArrowUp">▲</button><button data-k="ArrowDown">▼</button></div></div><div class="hint">Красный: W / S · Синий: ↑ / ↓ · R — рестарт · матч длится 5 минут · нажми на игровое поле для фокуса</div><script src="game.js"></script></body></html>
